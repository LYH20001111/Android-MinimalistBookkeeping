spring:
  application:
    name: bookkeeping-sync-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookkeeping}
    username: ${DB_USER:bookkeeping}
    password: ${DB_PASSWORD:bookkeeping}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  # 生产部署必须通过环境变量覆盖；至少 32 字节
  jwt-secret: ${JWT_SECRET:dev-only-secret-please-override-0123456789abcdef}
  jwt-ttl-minutes: 30
  refresh-ttl-days: 180
  verify-ttl-hours: 24
  # 对外可见的基础地址，用于拼验证链接（家庭部署填反向代理域名）
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:极简记账 <no-reply@localhost>}
  # 无 SMTP 环境下把验证链接打到服务端日志（开发模式）
  mail-dev-log-only: ${MAIL_DEV_LOG_ONLY:true}
  # 服务器管理员邮箱（逗号分隔）。为空时默认最早注册的账号是管理员（V3.1 决策 1）
  admin-emails: ${APP_ADMIN_EMAILS:}
  backup:
    # 备份文件目录（默认工作目录下 backups/；Docker 部署请挂载为卷）
    dir: ${BACKUP_DIR:./backups}
    # 每日自动备份时间（默认 03:00，Spring cron 含秒位）
    daily-cron: ${BACKUP_DAILY_CRON:0 0 3 * * *}
    auto-enabled: ${BACKUP_AUTO_ENABLED:true}
